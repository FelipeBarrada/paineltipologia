<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Painel municipal v13 curado</title><style>
:root{--navy:#071a35;--blue:#0b63ce;--blue2:#3985e7;--cyan:#dff1ff;--bg:#eef3f8;--surface:#fff;--text:#15243a;--muted:#66758a;--line:#d9e3ee;--shadow:0 12px 32px rgba(12,42,82,.12)}*{box-sizing:border-box}body{margin:0;font:14px Inter,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}header{height:76px;padding:15px 22px;background:linear-gradient(110deg,var(--navy),#103e78);color:#fff;border:0;box-shadow:0 3px 16px rgba(5,24,50,.25)}header h1{margin:0 0 5px;font-size:21px;letter-spacing:-.2px}header div{color:#c9dcf4;font-size:13px}.app{display:grid;grid-template-columns:minmax(430px,1fr) 500px;height:calc(100vh - 76px);gap:0}.mapbox{position:relative;overflow:hidden}.tools{position:absolute;z-index:2;display:flex;gap:8px;flex-wrap:wrap;margin:14px;padding:10px;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.75);border-radius:14px;box-shadow:var(--shadow)}.tools input,.tools select{height:40px;padding:0 12px;border:1px solid var(--line);border-radius:9px;background:#f9fbfd;color:var(--text);outline:none;transition:.18s}.tools input{width:220px}.tools input:focus,.tools select:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(57,133,231,.15);background:#fff}canvas{width:100%;height:100%;display:block;background:linear-gradient(160deg,#dcecf7,#edf5fa)}.side{background:#f7f9fc;border-left:1px solid var(--line);padding:20px;overflow:auto;box-shadow:-5px 0 22px rgba(13,45,86,.07)}.side h2{font-size:25px;line-height:1.15;margin:0 0 9px;letter-spacing:-.4px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:15px 0}.card{min-height:126px;border:1px solid var(--line);padding:14px;border-radius:13px;background:var(--surface);box-shadow:0 3px 12px rgba(17,54,94,.06);transition:transform .15s,box-shadow .15s}.card:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(17,54,94,.11)}.card b{display:block;color:var(--blue);font-size:24px;line-height:1.15;margin:6px 0}.meta{display:block;font-size:12px;line-height:1.35;color:var(--muted)}.search{width:100%;height:42px;padding:0 13px;margin:10px 0 7px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none}.search:focus{border-color:var(--blue2);box-shadow:0 0 0 3px rgba(57,133,231,.13)}.family,.theme{border:1px solid var(--line);border-radius:11px;margin:9px 0;overflow:hidden;background:#fff}.family>summary,.theme>summary{cursor:pointer;list-style:none;padding:13px 14px;font-weight:700;background:#eaf3ff;color:#183b68}.family>summary::-webkit-details-marker,.theme>summary::-webkit-details-marker{display:none}.family>summary:before,.theme>summary:before{content:"›";display:inline-block;margin-right:9px;font-size:18px;transition:.18s}.family[open]>summary:before,.theme[open]>summary:before{transform:rotate(90deg)}.theme>summary{background:#f6f9fc;color:#334b68}.badge{float:right;background:#d9e9ff;color:#164d92;padding:3px 8px;border-radius:999px;font-size:11px}.var{padding:12px 14px;border-top:1px solid #edf1f6}.var strong{display:block;line-height:1.35}.value{font-size:17px;font-weight:650;color:#163e73;margin:5px 0}.tech{font-size:12px;color:var(--muted);margin-top:6px}.tech summary{cursor:pointer;color:var(--blue)}.warn{color:#98620b}.hidden{display:none!important}.model-strip{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}.model-card{padding:13px 14px;border-radius:12px;color:#fff;background:linear-gradient(135deg,#123b70,#0b63ce);box-shadow:0 6px 18px rgba(11,99,206,.22)}.model-card span{display:block;font-size:12px;color:#d9e8fb}.model-card b{display:block;font-size:25px;margin:3px 0}.model-card small{color:#d9e8fb}.context-line{margin:3px 0 13px;padding:9px 11px;background:#fff;border:1px solid var(--line);border-radius:9px}.empty-state{margin-top:50px;padding:28px;text-align:center;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);color:var(--muted)}@media(max-width:1000px){.app{grid-template-columns:minmax(380px,1fr </style></head><body><header><h1>Capacidade estatal e entrega nos municípios brasileiros</h1><div>Enap | CGDados | v13 | setembro de 2026</div></header><main class="app"><section class="mapbox"><div class="tools"><input id="mq" placeholder="Buscar município"><select id="uf"><option value="">Todos os estados</option></select><select id="quad"><option value="">Todos os quadrantes</option><option value="Q1">Alta capacidade / alta entrega</option><option value="Q2">Alta capacidade / baixa entrega</option><option value="Q3">Baixa capacidade / alta entrega</option><option value="Q4">Baixa capacidade / baixa entrega</option></select><select id="porte"><option value="">Todos os portes</option></select></div><canvas id="map"></canvas></section><aside class="side" id="side"><div class="empty-state"><strong>Explore um município</strong><br><br>Use os filtros, pesquise pelo nome ou selecione diretamente no mapa.</div></aside></main><script src="data/resumo.js"></script><script src="data/topologia.js"></script><script>
const C=document.querySelector('#map'),X=C.getContext('2d'),S=document.querySelector('#side'),UF=document.querySelector('#uf'),QD=document.querySelector('#quad'),PT=document.querySelector('#porte');let H=[],SEL='';function polys(T){let O=Object.values(T.objects)[0],A=T.arcs,R=T.transform;function arc(i){let v=i<0;if(v)i=~i;let x=0,y=0,z=A[i].map(p=>{x+=p[0];y+=p[1];return[x*R.scale[0]+R.translate[0],y*R.scale[1]+R.translate[1]]});return v?z.reverse():z}return O.geometries.flatMap(g=>(g.type==='Polygon'?[g.arcs]:g.arcs).map(p=>({p:p.map(r=>r.flatMap(arc)),d:g.properties||{}})))}const P=polys(PAINEL_TOPOLOGY),N=Object.values(PAINEL_RESUMO);function txt(v){return String(v??'').trim()}let B=[Infinity,Infinity,-Infinity,-Infinity];P.forEach(o=>o.p.forEach(r=>r.forEach(([x,y])=>B=[Math.min(B[0],x),Math.min(B[1],y),Math.max(B[2],x),Math.max(B[3],y)])));let VIEW=B.slice();function viewForUF(u){if(!u)return B.slice();let b=[Infinity,Infinity,-Infinity,-Infinity];P.forEach(o=>{let c=String(o.d.cd_munic||'').replace('.0',''),m=PAINEL_RESUMO[c]||{};if(m.uf===u)o.p.forEach(r=>r.forEach(([x,y])=>{b[0]=Math.min(b[0],x);b[1]=Math.min(b[1],y);b[2]=Math.max(b[2],x);b[3]=Math.max(b[3],y)}))});if(!isFinite(b[0]))return B.slice();let dx=b[2]-b[0],dy=b[3]-b[1],pad=.12;return[b[0]-dx*pad,b[1]-dy*pad,b[2]+dx*pad,b[3]+dy*pad]}function draw(){let d=devicePixelRatio||1,w=C.clientWidth,h=C.clientHeight;C.width=w*d;C.height=h*d;X.setTransform(d,0,0,d,0,0);X.clearRect(0,0,w,h);let V=VIEW,sc=Math.min((w-20)/(V[2]-V[0]),(h-20)/(V[3]-V[1])),ox=(w-sc*(V[2]-V[0]))/2,oy=(h-sc*(V[3]-V[1]))/2,u=UF.value,q=QD.value,t=PT.value;H=[];P.forEach(o=>{let p=new Path2D;o.p.forEach(r=>r.forEach(([x,y],i)=>{let xx=ox+(x-V[0])*sc,yy=h-(oy+(y-V[1])*sc);i?p.lineTo(xx,yy):p.moveTo(xx,yy)}));p.closePath();let c=String(o.d.cd_munic||'').replace('.0',''),m=PAINEL_RESUMO[c]||{},match=(!u||m.uf===u)&&(!q||(m.quadrante||'').startsWith(q))&&(!t||txt(m.porte)===t),active=u||q||t;let col={'Q1':'#168821','Q2':'#e97800','Q3':'#2670e8','Q4':'#d83020'}[(m.quadrante||'').slice(0,2)]||'#cad5df';X.globalAlpha=active?(match?1:.1):1;X.fillStyle=c===SEL?'#ffb000':col;X.fill(p);X.globalAlpha=1;X.strokeStyle=match&&active?'#111827':'#fff';X.lineWidth=match&&active?.8:.22;X.stroke(p);H.push({p,c,match})})}addEventListener('resize',draw);UF.onchange=()=>{VIEW=viewForUF(UF.value);SEL='';draw()};QD.onchange=draw;PT.onchange=draw;[...new Set(N.map(x=>x.uf).filter(Boolean))].sort().forEach(x=>UF.add(new Option(x,x)));[...new Set(N.map(x=>txt(x.porte)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'pt-BR',{numeric:true})).forEach(x=>PT.add(new Option(x,x)));draw();C.onclick=e=>{const r=C.getBoundingClientRect(),x=(e.clientX-r.left)*(C.clientWidth/r.width),y=(e.clientY-r.top)*(C.clientHeight/r.height);X.save();X.setTransform(1,0,0,1,0,0);for(let i=H.length-1;i>=0;i--){if(H[i].match&&X.isPointInPath(H[i].p,x,y)){X.restore();load(H[i].c);return}}X.restore()};function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function load(c){SEL=c;draw();S.innerHTML='Carregando...';document.querySelector('#munjs')?.remove();let z=document.createElement('script');z.id='munjs';z.src='data/municipios/'+c+'.js';z.onerror=()=>S.textContent='Detalhe não encontrado.';document.body.appendChild(z)}document.querySelector('#mq').onchange=e=>{let q=e.target.value.toLowerCase(),m=N.find(x=>(!UF.value||x.uf===UF.value)&&(!QD.value||(x.quadrante||'').startsWith(QD.value))&&(!PT.value||txt(x.porte)===PT.value)&&(x.municipio||'').toLowerCase().includes(q));if(m)load(m.cd_munic)};function nat(a,b){return String(a).localeCompare(String(b),'pt-BR',{numeric:true,sensitivity:'base'})}function semAcento(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase()}function num(v){if(v===null||v===undefined)return NaN;let z=String(v).trim().replace(/\s/g,'');if(z.includes(',')&&z.includes('.'))z=z.replace(/\./g,'').replace(',','.');else if(z.includes(','))z=z.replace(',','.');return Number(z)}function fmt(v,tipo){let n=num(v);if(!Number.isFinite(n))return 'Sem dado';if(tipo==='int')return Math.round(n).toLocaleString('pt-BR');if(tipo==='pct')return n.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2})+'%';if(tipo==='brl')return n.toLocaleString('pt-BR',{style:'currency',currency:'BRL',minimumFractionDigits:2,maximumFractionDigits:2});return n.toLocaleString('pt-BR',{maximumFractionDigits:2})}function exata(vs,codigos){let cs=codigos.map(semAcento);return vs.find(x=>cs.includes(semAcento(x.v))||cs.includes(semAcento(x.k)))}function item(vs,codigos,tipo,meta){let v=exata(vs,codigos);if(!v||!Number.isFinite(num(v.x)))return{valor:'Sem dado',meta:meta||''};return{valor:fmt(v.x,tipo),meta:[v.f,v.a,v.v].filter(Boolean).join(' · ')||meta||''}}function receitaPC(vs,pop){let pronta=exata(vs,['receita_propria_pcap_2023','receita_propria_per_capita_2023','receita_propria_por_habitante_2023']);if(pronta&&Number.isFinite(num(pronta.x)))return{valor:fmt(pronta.x,'brl'),meta:[pronta.f,pronta.a,pronta.v].filter(Boolean).join(' · ')};let base=exata(vs,['receita_tributaria','x1_1_0_0_00_0_0_impostos_taxas_e_contribuicoes_de_melhoria']);let n=num(base&&base.x),den=num(pop);if(Number.isFinite(n)&&Number.isFinite(den)&&den>0)return{valor:fmt(n/den,'brl'),meta:'STN - SICONFI · 2023 · receita tributária ÷ população'};return{valor:'Sem dado',meta:'STN - SICONFI · 2023'}}window.__entregaMunicipio=p=>{let m=p.municipio,F={},pop=m.populacao,superior=item(p.variaveis,['perc_SUP..COMP'],'pct','RAIS - Ministério do Trabalho · 2020 · perc_SUP..COMP'),receita=receitaPC(p.variaveis,pop),esgoto=item(p.variaveis,['esgoto_2022'],'pct','IBGE · Censo 2022 · esgoto_2022'),ideb=item(p.variaveis,['ideb2023'],'num','INEP · 2023 · ideb2023');p.variaveis.sort((a,b)=>nat(a.k,b.k)).forEach(v=>((F[v.b]??={})[v.g]??=[]).push(v));S.innerHTML=`<h2>${esc(m.municipio)} - ${esc(m.uf)}</h2><div><strong>População: ${esc(fmt(pop,'int'))}</strong></div><div class="context-line"><span class="meta">Cod.: ${esc(m.cd_munic)} · ${esc(m.regiao)} · Porte ${esc(m.porte)}</span></div><div class="model-strip"><div class="model-card"><span>Índice de Capacidade Estatal (ICE)</span><b>${esc(m.ICE)}</b><small>Percentil ${esc(m.posicao_ICE)}</small></div><div class="model-card"><span>Índice de Entrega Governamental (IEG)</span><b>${esc(m.IEG)}</b><small>Percentil ${esc(m.posicao_IEG)}</small></div></div><div class="cards"><div class="card">Servidores com ensino superior<b>${esc(superior.valor)}</b><span class="meta">${esc(superior.meta)}</span></div><div class="card">Receita própria por habitante<b>${esc(receita.valor)}</b><span class="meta">${esc(receita.meta)}</span></div><div class="card">População atendida por esgoto<b>${esc(esgoto.valor)}</b><span class="meta">${esc(esgoto.meta)}</span></div><div class="card">IDEB dos anos iniciais<b>${esc(ideb.valor)}</b><span class="meta">${esc(ideb.meta)}</span></div></div><p><b>${esc(m.quadrante)}</b><br>${esc(m.perfil)} | fronteira: ${esc(m.fronteira)}</p><input class="search" id="vq" placeholder="Buscar variável, tema ou fonte"><div id="vars">${Object.keys(F).sort(nat).map(f=>`<details class="family"><summary>${esc(f)}<span class="badge">${Object.values(F[f]).flat().length}</span></summary>${Object.keys(F[f]).sort(nat).map(g=>`<details class="theme"><summary>${esc(g)}<span class="badge">${F[f][g].length}</span></summary>${F[f][g].map(v=>`<article class="var" data-s="${esc((v.d+' '+v.k+' '+v.g+' '+v.f).toLowerCase())}"><strong>${esc(v.d)}</strong><div class="value">${esc(v.x)}</div><details class="tech"><summary>Ver detalhes técnicos</summary><div>Código: ${esc(v.v)}<br>Fonte: ${esc(v.f)}<br>Ano: ${esc(v.a||'não informado')}<br>Cobertura nacional: ${esc(v.c||'não informada')}%<br>Regra de agregação: ${esc(v.r)}${v.w?'<br><span class="warn">Alerta: '+esc(v.w)+'</span>':''}</div></details></article>`).join('')}</details>`).join('')}</details>`).join('')}</div>`;document.querySelector('#vq').oninput=e=>{let q=e.target.value.toLowerCase();document.querySelectorAll('.var').forEach(v=>v.classList.toggle('hidden',!v.dataset.s.includes(q)));document.querySelectorAll('.family,.theme').forEach(d=>{if(q)d.open=true})}}
